name: Package English game

on:
  push:
    branches: [codex/english-air-combat]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prepare:pages
      - uses: actions/upload-artifact@v4
        with:
          name: english-air-combat
          path: .pages-output
          include-hidden-files: true
