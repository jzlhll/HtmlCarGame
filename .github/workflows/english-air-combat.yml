name: Package English game

on:
  push:
    branches: [main]
    paths:
      - 'english-air-combat/**'
      - '.github/workflows/english-air-combat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: english-air-combat
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: english-air-combat/package-lock.json
      - run: npm ci
      - run: npm run prepare:pages
      - uses: actions/upload-artifact@v4
        with:
          name: english-air-combat
          path: english-air-combat/.pages-output
          include-hidden-files: true
